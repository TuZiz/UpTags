settings:
  default-title-coin-balance: 10
  session-timeout-seconds: 120
  costs:
    money: 888888
    points: 35
    title-coin: 100

presets:
  basic:
    min-length: 2
    max-length: 12
    random-schemes: 4
    colors-per-scheme: 2
    allow-spaces: true
    allowed-pattern: '^[A-Za-z0-9_\u4e00-\u9fa5 ]+$'
    blocked-words:
      - admin
      - gm
      - op
    blocked-patterns:
      - '(?i)owner'

    palette-libraries:
      single:
        # --- 基础纯色 & 亮色 ---
        - [ '#FDE68A' ] # 暖阳黄
        - [ '#FF8FD8' ] # 蔷薇粉
        - [ '#7DD3FC' ] # 晴空蓝
        - [ '#86EFAC' ] # 薄荷绿
        - [ '#FF79C6' ] # 猛男粉
        - [ '#FFD700' ] # 皇室金
        - [ '#50FA7B' ] # 荧光绿
        - [ '#00BFFF' ] # 深水蓝
        - [ '#BD93F9' ] # 罗兰紫
        - [ '#F8F8F2' ] # 象牙白
        # --- 新增：高级质感纯色 ---
        - [ '#FF1493' ] # 亮深粉
        - [ '#00FF7F' ] # 春日青
        - [ '#00CED1' ] # 暗绿松石
        - [ '#FFDAB9' ] # 蜜桃奶油
        - [ '#B0E0E6' ] # 冰晶粉蓝

      double:
        # --- 基础与热门双拼 ---
        - [ '#7DD3FC', '#C084FC' ]
        - [ '#86EFAC', '#FDE68A' ]
        - [ '#F8FAFC', '#93C5FD' ]
        - [ '#FF9A9E', '#FECFEF' ] # 玫瑰晚霞
        - [ '#FFD700', '#FF5252' ] # 皇室金红
        - [ '#F6D365', '#FDA085' ] # 温暖夏日
        - [ '#8BE9FD', '#00BFFF' ] # 冰川深蓝
        - [ '#43E97B', '#38F9D7' ] # 极光薄荷
        - [ '#FF79C6', '#8BE9FD' ] # 经典赛博
        - [ '#A18CD1', '#FBC2EB' ] # 丁香紫粉
        # --- 新增：极致反差与自然双拼 ---
        - [ '#FF0844', '#FFB199' ] # 熔岩火山
        - [ '#00C6FB', '#005BEA' ] # 深海遗迹
        - [ '#F77062', '#FE5196' ] # 缤纷果汁
        - [ '#16A085', '#F4D03F' ] # 丛林日光
        - [ '#9796F0', '#FBC7D4' ] # 棉花糖
        - [ '#4FACFE', '#00F2FE' ] # 水晶之恋
        - [ '#FA709A', '#FEE140' ] # 破晓晨曦

      triple:
        # --- 基础与热门三拼 ---
        - [ '#86EFAC', '#FDE68A', '#FF8FD8' ]
        - [ '#00F2FE', '#4FACFE', '#C084FC' ]
        - [ '#FF5252', '#FFD700', '#50FA7B' ] # 热带雨林
        - [ '#BD93F9', '#FF79C6', '#8BE9FD' ] # 赛博幻梦
        - [ '#FF9A9E', '#FECFEF', '#F8FAFC' ] # 樱花落雪
        - [ '#38F9D7', '#43E97B', '#FDE68A' ] # 夏日柠檬
        - [ '#A18CD1', '#C084FC', '#FF8FD8' ] # 梦幻星云
        - [ '#FDE68A', '#FDA085', '#FF5252' ] # 余晖烈阳
        # --- 新增：高级感丝滑三拼 ---
        - [ '#84FAB0', '#8FD3F4', '#A1C4FD' ] # 清晨露水 (绿-浅蓝-灰蓝)
        - [ '#FCCB90', '#FF9A9E', '#C084FC' ] # 暮色降临 (橘黄-粉-紫)
        - [ '#E0C3FC', '#8EC5FC', '#4FACFE' ] # 冬日魔法 (浅紫-蓝-深蓝)
        - [ '#F6D365', '#FFB199', '#FF0844' ] # 烈火之心 (黄-橘红-深红)
        - [ '#4FACFE', '#00F2FE', '#43E97B' ] # 浅滩海浪 (蓝-青-绿)
        - [ '#50FA7B', '#F1FA8C', '#FFB86C' ] # 霓虹柑橘 (荧绿-荧黄-橙)

      quad:
        # --- 基础与热门四拼 ---
        - [ '#F8FAFC', '#93C5FD', '#7DD3FC', '#C084FC' ]
        - [ '#FFD700', '#FF8FD8', '#86EFAC', '#7DD3FC' ]
        - [ '#FF5252', '#FF79C6', '#BD93F9', '#8BE9FD' ] # 赛博全彩
        - [ '#FF9A9E', '#FFD700', '#86EFAC', '#7DD3FC' ] # 四季流转
        - [ '#0052D4', '#4364F7', '#6FB1FC', '#8BE9FD' ] # 极地深海
        - [ '#F6D365', '#FDA085', '#FF8177', '#FF5252' ] # 火焰渐变
        - [ '#E0C3FC', '#8EC5FC', '#A18CD1', '#C084FC' ] # 梦幻紫罗兰
        # --- 新增：终极华丽长渐变 (专为炫酷称号打造) ---
        - [ '#FF758C', '#FF7EB3', '#D299C2', '#FDFBFB' ] # 甜美罗曼史 (深粉-亮粉-灰紫-白)
        - [ '#A18CD1', '#FBC2EB', '#8FD3F4', '#84FAB0' ] # 马卡龙彩虹 (紫-粉-蓝-绿)
        - [ '#F6D365', '#FDA085', '#F77062', '#FE5196' ] # 龙舌兰日出 (黄-橙-粉红-亮紫粉)
        - [ '#00C6FB', '#005BEA', '#30CFD0', '#B388FF' ] # 银河星空 (青蓝-深蓝-蓝绿-亮紫)
        - [ '#11998E', '#38EF7D', '#BBF0F3', '#F8F8F2' ] # 翡翠之城 (深绿-亮绿-浅青-白)
        - [ '#FF9A9E', '#FECFEF', '#E0C3FC', '#8EC5FC' ] # 童话仙境 (粉红-浅粉-浅紫-浅蓝)
        - [ '#FF0844', '#FFB199', '#FCCB90', '#FDE68A' ] # 凤凰涅槃 (深红-橘红-橘黄-浅黄)
        - [ '#2193B0', '#6DD5ED', '#A8EDEA', '#FED6E3' ] # 云端漫步 (深蓝-天蓝-水青-淡粉)
        - [ '#B3FFAB', '#12FFF7', '#00BFFF', '#A18CD1' ] # 北极星光 (浅绿-青-深蓝-紫)

    random-color-pool:
      # 在原有基础上扩充，确保单色随机出来的效果依然很能打
      - '#FDE68A'
      - '#FF8FD8'
      - '#7DD3FC'
      - '#C084FC'
      - '#86EFAC'
      - '#93C5FD'
      - '#FF79C6'
      - '#FF5252'
      - '#FFD700'
      - '#FFAA00'
      - '#50FA7B'
      - '#00FA9A'
      - '#8BE9FD'
      - '#00BFFF'
      - '#BD93F9'
      - '#F8F8F2'
      - '#FF1493'
      - '#00FF7F'
      - '#00CED1'
      - '#FFDAB9'

    preview-template: '&#FDE68A当前预览: %title%'
    equip-after-confirm: true