settings:
  effect-tick-interval: 20
  force-default-tag:
    enabled: true
    tag-id: "newbie"

storage:
  pg:
    jdbc-url: "jdbc:postgresql://127.0.0.1:5432/minecraft"
    username: "postgres"
    password: "change-me"
    table: "uptags_player_data"

sync:
  server-id: "server-1"
  online-refresh-delay-ticks: 20
  stale-max-age-seconds: 3
  redis:
    enabled: false
    uri: "redis://127.0.0.1:6379"
    channel: "uptags:player-sync"

