settings:
  effect-tick-interval: 20
  force-default-tag:
    enabled: true
    tag-id: "newbie"

storage:
  mode: "yml"
  yml:
    file: "data/playerdata"
  mysql:
    jdbc-url: "jdbc:mysql://127.0.0.1:3306/minecraft?useSSL=false&characterEncoding=utf8"
    username: "root"
    password: "change-me"
    table: "uptags_player_data"

detach:
  enabled: true
  buff:
    money:
      amount: 100
    points:
      amount: 100
  particle:
    money:
      amount: 100
    points:
      amount: 100

sync:
  server-id: "server-1"
  online-refresh-delay-ticks: 20
  stale-max-age-seconds: 3
  redis:
    enabled: false
    uri: "redis://127.0.0.1:6379"
    channel: "uptags:player-sync"

