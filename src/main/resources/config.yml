settings:
  effect-tick-interval: 20
  # 挑战进度会先写入内存，再按间隔合并保存，避免 1 秒级移动/统计事件频繁更新整份 JSON。
  challenge-progress-save-interval-seconds: 30
  particles:
    frequency-ticks: 20
    count-multiplier: 1
    view-distance: 32
  buffs:
    disabled-worlds: []
    disabled-permission: ""
    disable-in-pvp: false
  force-default-tag:
    enabled: true
    tag-id: "newbie"

storage:
  mode: "yml"
  yml:
    file: "data/playerdata"
  mysql:
    jdbc-url: "jdbc:mysql://127.0.0.1:3306/minecraft?useSSL=false&characterEncoding=utf8"
    username: "root"
    password: "change-me"
    table: "uptags_player_data"

detach:
  enabled: true
  buff:
    money:
      amount: 100
    points:
      amount: 100
  particle:
    money:
      amount: 100
    points:
      amount: 100

sync:
  server-id: "server-1"
  online-refresh-delay-ticks: 20
  stale-max-age-seconds: 3
  redis:
    enabled: false
    uri: "redis://127.0.0.1:6379"
    channel: "uptags:player-sync"

collection:
  categories:
    challenge:
      display: "挑战称号"
      material: "DIAMOND_PICKAXE"
      completed-material: "NETHER_STAR"
      description:
        - "&#94A3B8统计、探索、击杀、维度等挑战来源"
      product-categories:
        - "challenge"
      modes:
        - "CHALLENGE_CLAIM"
      reward-tag: "challenge_collector"
    exchange:
      display: "兑换称号"
      material: "CHEST"
      completed-material: "ENDER_CHEST"
      description:
        - "&#94A3B8通过提交材料解锁的称号"
      product-categories:
        - "exchange"
      modes:
        - "ITEM_EXCHANGE"
      reward-tag: "exchange_collector"
    buy:
      display: "购买称号"
      material: "EMERALD"
      completed-material: "EMERALD_BLOCK"
      description:
        - "&#94A3B8通过点券、金币或称号币购买"
      product-categories:
        - "buy"
      modes:
        - "BUY"
      reward-tag: ""
    limited:
      display: "限定称号"
      material: "NETHER_STAR"
      completed-material: "BEACON"
      description:
        - "&#94A3B8赛季、活动、声望和特殊来源"
      product-categories:
        - "limited"
      modes:
        - "SEASONAL"
        - "PRESTIGE"
      reward-tag: "limited_collector"

